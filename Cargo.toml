[package]
name = "nuthatch-x402"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "An x402 payment sidecar for priced Nuthatch named queries"
repository = "https://github.com/nightswatchhq/nuthatch-x402"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
