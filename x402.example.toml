# Merchant policy belongs here, outside the content-addressed nest definition.
[provider]
upstream = "http://127.0.0.1:8288"
network = "eip155:84532" # Base Sepolia. Use eip155:8453 for Base mainnet.
asset = "0x036CbD53842c5426634e7929541eC2318f3dCF7e" # Base Sepolia USDC
pay_to = "0xYourMerchantAddress"

[[query]]
name = "latest_transfers"
price_atomic = "2000" # 0.002 USDC
description = "The latest indexed transfer events"

[[query]]
name = "top_holders"
price_atomic = "5000" # 0.005 USDC
description = "The highest balance holders in the indexed range"
